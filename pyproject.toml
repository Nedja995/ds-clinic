[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsclinic"
version = "2.1.7"
description = "MedAI Assistant - ViTec"
dependencies = [
    "google-genai",
    "pydantic",
    "pydantic-settings>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[autopep8]
max_line_length = 500


